[project]
name = "ai-simtest-api"
version = "0.5.0"
description = "AI SimTest SaaS Control Plane API — S2 Week 5 (Asset Registry + Hybrid Storage)"
requires-python = ">=3.11"
authors = [
    { name = "Bishnu Prasad Panda" },
]

dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "boto3>=1.34",
    "botocore>=1.34,<1.40",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
