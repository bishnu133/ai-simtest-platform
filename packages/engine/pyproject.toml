[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-simtest"
version = "0.2.0"
description = "Open-source AI simulation testing platform — Test your chatbots with 100+ personas in minutes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bishnu Prasad Panda" }
]
keywords = [
    "ai", "testing", "chatbot", "simulation", "qa", "llm",
    "evaluation", "personas", "guardrails", "bot-testing",
    "conversation-testing", "ai-safety", "prompt-testing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # Core framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # LLM orchestration
    "litellm>=1.30.0",
    "httpx>=0.27.0",

    # Evaluation models
    "sentence-transformers>=2.3.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "detoxify>=0.5.0",

    # NLP (required by presidio)
    "spacy>=3.7.0",

    # CLI & output
    "click>=8.1.0",
    "rich>=13.7.0",

    # Logging
    "structlog>=24.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
simtest = "ai_simtest_engine.cli:main"

[project.urls]
Homepage = "https://github.com/bishnu133/ai-simtest"
Repository = "https://github.com/bishnu133/ai-simtest"
Issues = "https://github.com/bishnu133/ai-simtest/issues"
Documentation = "https://github.com/bishnu133/ai-simtest#readme"

[tool.hatch.build.targets.wheel]
packages = ["ai_simtest_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true