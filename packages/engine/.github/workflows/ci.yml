name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --select E,F,W --ignore E501

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/test_core.py tests/test_providers.py tests/test_enhancements.py -v --tb=short

      - name: Start mock bot server
        run: |
          python -m tests.mock_bot_server &
          sleep 2

      - name: Run integration tests
        run: |
          PYTHONPATH=. pytest tests/test_integration.py -v --tb=short

      - name: Run API tests
        run: |
          PYTHONPATH=. pytest tests/test_api.py -v --tb=short

      - name: Run all remaining tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short --ignore=tests/test_core.py --ignore=tests/test_providers.py --ignore=tests/test_enhancements.py --ignore=tests/test_integration.py --ignore=tests/test_api.py
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ai-simtest:latest .

      - name: Verify container starts
        run: |
          docker run --rm ai-simtest:latest simtest version
