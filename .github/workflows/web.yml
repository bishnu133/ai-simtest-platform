name: Dashboard

on:
  push:
    branches: [main]
    paths: ["packages/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["packages/web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in package.json's packageManager
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
